<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점심 메뉴 룰렛 — 크롬 확장 프로그램 | 午餐轮盘扩展程序</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="extension-container">
    <header class="app-header">
      <div class="header-badge-row">
        <span class="badge">🚀 DU-FLEX 실습 7 · 实践 7</span>
        <span class="ext-badge">Chrome Extension MV3</span>
      </div>
      <h1>🍽️ 점심 메뉴 룰렛</h1>
      <p class="subtitle">오늘 점심 뭐 먹지? 2초 만에 결정!</p>
      <p class="subtitle-zh">今天午餐吃什么？2秒转出今日美味！</p>
    </header>

    <main class="main-content">
      <!-- 룰렛 영역 -->
      <section class="roulette-section">
        <div class="wheel-wrapper">
          <div class="pointer" aria-hidden="true">▼</div>
          <canvas id="wheelCanvas" width="340" height="340"></canvas>
        </div>

        <button id="spinBtn" class="spin-button" type="button">
          🎲 룰렛 돌리기 (2초 회전) · 开始旋转
        </button>

        <!-- 결과 표시 카드 (기능 ②) -->
        <div id="resultCard" class="result-card hidden">
          <span class="result-label">🎉 오늘 추천 점심 메뉴 · 今日推荐午餐</span>
          <div id="resultText" class="result-text">---</div>
          <p class="result-desc">맛있게 드시고 힘찬 하루 보내세요! / 祝您用餐愉快！</p>
        </div>
      </section>

      <!-- 메뉴 목록 관리 영역 (기능 ① & ③) -->
      <section class="menu-manager-section">
        <div class="manager-header">
          <h2>📋 메뉴 목록 관리 · 菜单管理</h2>
          <span id="menuCountBadge" class="count-badge">0개</span>
        </div>

        <!-- 메뉴 입력 폼 -->
        <form id="addMenuForm" class="add-form" onsubmit="return false;">
          <input
            type="text"
            id="menuInput"
            placeholder="메뉴명 입력 (예: 마라탕) / 输入菜品"
            maxlength="20"
            autocomplete="off"
            required
          />
          <button type="submit" id="addBtn" class="add-button">추가 · 添加</button>
        </form>

        <!-- 메뉴 목록 -->
        <div class="menu-list-container">
          <ul id="menuList" class="menu-list">
            <!-- 동적으로 렌더링 -->
          </ul>
        </div>

        <!-- 관리 버튼 -->
        <div class="actions-footer">
          <button id="resetPresetBtn" class="secondary-btn" type="button">
            🔄 한·중 인기 6종 복원 · 恢复预设
          </button>
          <button id="clearAllBtn" class="danger-btn" type="button">
            🗑️ 전체 삭제 · 清空
          </button>
        </div>
        <p class="storage-notice">
          💾 데이터는 chrome.storage.local에 자동 보존되어 팝업을 닫아도 유지됩니다.
        </p>
      </section>
    </main>

    <footer class="app-footer">
      <p>DU-FLEX 7주차 실습 7 · 점심 메뉴 룰렛 크롬 확장 프로그램 (Manifest V3)</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
