<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>집중 응원 배지</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      padding: 18px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .header-text h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #312e81;
    }

    .header-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* 응원 문구 카드 (기능 ②) */
    .quote-card {
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      border: 1px solid #c7d2fe;
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 16px;
      position: relative;
    }

    .quote-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #4338ca;
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 8px;
      border-radius: 9999px;
      margin-bottom: 6px;
    }

    .quote-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: #1e1b4b;
      line-height: 1.45;
      min-height: 40px;
    }

    .quote-zh {
      display: block;
      font-size: 0.75rem;
      color: #6366f1;
      margin-top: 4px;
    }

    .refresh-quote-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      color: #6366f1;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.2s;
    }

    .refresh-quote-btn:hover {
      transform: rotate(45deg);
    }

    /* 타이머 영역 (기능 ①) */
    .timer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }

    .timer-display {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(79, 70, 229, 0.15);
    }

    .timer-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      padding: 10px 0;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-start {
      background: #10b981;
      color: #ffffff;
    }

    .btn-pause {
      background: #f59e0b;
      color: #ffffff;
    }

    .btn-reset {
      background: #e2e8f0;
      color: #475569;
    }

    /* 오늘 완료한 집중 횟수 (기능 ③) */
    .badge-counter-card {
      background: #fffbeb;
      border: 1px solid #fef08a;
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .counter-info {
      display: flex;
      flex-direction: column;
    }

    .counter-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #92400e;
    }

    .counter-zh {
      font-size: 0.68rem;
      color: #b45309;
    }

    .counter-value-wrapper {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .counter-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #d97706;
    }

    .counter-unit {
      font-size: 0.82rem;
      font-weight: 700;
      color: #92400e;
    }

    /* Footer */
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <header class="header">
    <img src="icon.png" alt="아이콘" class="header-icon">
    <div class="header-text">
      <h1>집중 응원 배지</h1>
      <p>DU-FLEX 7주차 크롬 확장 프로그램</p>
    </div>
  </header>

  <!-- 기능 ②: 오늘의 응원 문구 10개 중 무작위 표시 -->
  <section class="quote-card">
    <span class="quote-badge">💡 오늘의 응원 문구 · 每日寄语</span>
    <button id="refreshQuoteBtn" class="refresh-quote-btn" title="다른 문구 보기" type="button">🎲</button>
    <div id="quoteText" class="quote-text">...</div>
    <span id="quoteZh" class="quote-zh">...</span>
  </section>

  <!-- 기능 ①: 25분 집중 타이머 (시작/정지/초기화) -->
  <section class="timer-card">
    <div id="timerDisplay" class="timer-display">25:00</div>
    <div class="timer-controls">
      <button id="startPauseBtn" class="btn btn-start" type="button">시작 · 开始</button>
      <button id="resetBtn" class="btn btn-reset" type="button">초기화 · 重置</button>
    </div>
  </section>

  <!-- 기능 ③: 오늘 완료한 집중 횟수 저장 및 표시 -->
  <section class="badge-counter-card">
    <div class="counter-info">
      <span class="counter-label">🏅 오늘 완료한 집중 · 今日专注完成</span>
      <span class="counter-zh">25분 세션을 마칠 때마다 자동 누적</span>
    </div>
    <div class="counter-value-wrapper">
      <span id="focusCount" class="counter-value">0</span>
      <span class="counter-unit">회 (次)</span>
    </div>
  </section>

  <footer class="footer">
    최소 권한 준수 (storage 전용) · 외부 통신 없음
  </footer>

  <script src="popup.js"></script>
</body>
</html>
